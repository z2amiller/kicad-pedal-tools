[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kicad-pedal-common"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["jsonschema>=4.0"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
