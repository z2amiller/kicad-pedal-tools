name: CI — build-doc-plugin

on:
  push:
    branches: [main]
    paths:
      - 'build-doc-plugin/**'
      - 'kicad_pedal_common/**'
  pull_request:
    paths:
      - 'build-doc-plugin/**'
      - 'kicad_pedal_common/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install dependencies
        run: |
          cd build-doc-plugin
          pip install ruff pytest pypdf reportlab pillow jsonschema referencing
      - name: Lint
        run: |
          cd build-doc-plugin
          ruff check .
      - name: Format check
        run: |
          cd build-doc-plugin
          ruff format --check .
      - name: Test
        run: |
          cd build-doc-plugin
          pytest tests/ -v
        env:
          PYTHONPATH: ${{ github.workspace }}
