name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Test
        run: pytest tests/ -v

  consumer-build-doc-plugin:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout kicad-pedal-common
        uses: actions/checkout@v4
        with:
          path: kicad-pedal-common

      - name: Checkout kicad-build-doc-plugin
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/kicad-build-doc-plugin
          path: kicad-build-doc-plugin

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Vendor kicad_pedal_common
        run: bash kicad-pedal-common/scripts/vendor.sh kicad-build-doc-plugin

      - name: Install dependencies
        run: |
          cd kicad-build-doc-plugin
          pip install ruff pytest pypdf reportlab pillow jsonschema referencing

      - name: Test
        run: |
          cd kicad-build-doc-plugin
          pytest tests/ -v

  consumer-manifest-creator:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout kicad-pedal-common
        uses: actions/checkout@v4
        with:
          path: kicad-pedal-common

      - name: Checkout manifest-creator
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/manifest-creator
          path: manifest-creator

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Vendor kicad_pedal_common
        run: bash kicad-pedal-common/scripts/vendor.sh manifest-creator

      - name: Install dev dependencies
        run: |
          cd manifest-creator
          pip install -e ".[dev]"

      - name: Test
        run: |
          cd manifest-creator
          pytest tests/ -v
